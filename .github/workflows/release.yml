name: Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm install --prefix app

      - name: Run tests
        run: npm test --prefix app

      - name: Validate release metadata
        shell: bash
        run: |
          test "${RELEASE_VERSION}" = "v2.3.0"
          test "$(node -p "require('./app/package.json').version")" = "${RELEASE_VERSION#v}"
          test "$(node -p "require('./release/release.json').version")" = "${RELEASE_VERSION#v}"
          grep -q "version: ${RELEASE_VERSION}" release/release-summary.yml

  deploy-production:
    runs-on: ubuntu-latest
    needs: validate-release
    environment:
      name: production
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy production release
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "${RELEASE_VERSION}"

env:
  RELEASE_VERSION: v2.3.0
